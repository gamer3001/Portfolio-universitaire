<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaporama - Infrastructure & Domotique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --accent-light: #3d6ab8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Arrière-plan étoilé */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* Navigation haut */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 900;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem 4rem;
        }
        .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 300; letter-spacing: 0.05em; color: var(--text-primary); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.05em; transition: color 0.3s ease; text-transform: lowercase; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }

        /* Conteneur de la page */
        .presentation-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8rem 4rem 4rem;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }
        .back-btn:hover { color: var(--text-primary); }

        /* Conteneur principal du diaporama */
        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #050505;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Style spécifique quand on est en plein écran */
        .slider-container:fullscreen {
            border: none;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .slider-container:-webkit-full-screen { border: none; border-radius: 0; width: 100vw; height: 100vh; background: #000; }
        .slider-container:-ms-fullscreen { border: none; border-radius: 0; width: 100vw; height: 100vh; background: #000; }

        /* --- ANIMATIONS ET TRANSITIONS DES DIAPOS --- */
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96) translateY(10px); 
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                        visibility 0.6s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* On s'assure que la vidéo et les images ont le même comportement ! */
        .slide img, .slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Interface Overlay (Flèches, Points, Plein écran) */
        .slider-ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        /* Bouton Plein Écran */
        .fullscreen-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            opacity: 0;
        }
        .slider-container:hover .fullscreen-btn { opacity: 1; }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); }

        /* Flèches latérales */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            opacity: 0;
        }
        .slider-container:hover .nav-arrow { opacity: 1; }
        .nav-arrow:hover { background: var(--accent-light); border-color: var(--accent-light); }
        .nav-arrow.prev { left: 1.5rem; }
        .nav-arrow.next { right: 1.5rem; }

        /* Points de progression en bas */
        .dots-wrapper {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            display: flex;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .slider-container:hover .dots-wrapper { opacity: 1; }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dot.active { background: white; transform: scale(1.3); }

        /* Masquer la navigation globale en mode plein écran */
        :fullscreen ~ nav { display: none; }
        :-webkit-full-screen ~ nav { display: none; }
        :-ms-fullscreen ~ nav { display: none; }

        @media (max-width: 768px) {
            .presentation-wrapper { padding: 6rem 1rem 2rem; }
            .nav-arrow, .fullscreen-btn, .dots-wrapper { opacity: 1; }
            .nav-arrow { width: 40px; height: 40px; }
            .nav-arrow.prev { left: 0.5rem; }
            .nav-arrow.next { right: 0.5rem; }
        }
    
.presentation-footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    margin-top:2rem;
    margin-bottom:2rem;
}
#qrcode{
    background:rgba(255,255,255,0.05);
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
}
.pdf-download{
    color:var(--text-primary);
    text-decoration:none;
    font-size:0.9rem;
    transition:all .3s ease;
}
.pdf-download:hover{
    color:white;
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <section class="presentation-wrapper">
        <a href="diaporamas.html" class="back-btn">← Retour aux diaporamas</a>

        <div class="slider-container" id="presentation-slider">
            
            <div class="slide active">
                <img src="Data/Images/Diaporama/Datacenter EPIL/1.jpg" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="Data/Images/Diaporama/Datacenter EPIL/2.jpg" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="Data/Images/Diaporama/Datacenter EPIL/3.jpg" alt="Slide 3">
            </div>
            <div class="slide">
                <img src="Data/Images/Diaporama/Datacenter EPIL/4.jpg" alt="Slide 4">
            </div>
            <div class="slide">
                <img src="Data/Images/Diaporama/Datacenter EPIL/5.jpg" alt="Slide 5">
            </div>
            
            <div class="slide">
                <video src="Data/Images/Diaporama/Datacenter EPIL/6.mp4" playsinline controls muted></video>

                <div class="dots-wrapper" id="sliderDots"></div>
            </div>

        
</div>

<div class="presentation-footer">

    <script>
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('sliderDots');
        const sliderContainer = document.getElementById('presentation-slider');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        let currentSlide = 0;

        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function updateSlider() {
            slides.forEach((slide, index) => {
                // On met tout le monde en "inactif" par défaut
                slide.classList.remove('active');
                dots[index].classList.remove('active');
                
                // Si la slide qu'on quitte contient une vidéo, on la met en pause et on la reset à 0
                const video = slide.querySelector('video');
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                }

                // Si c'est la NOUVELLE slide active
                if (index === currentSlide) {
                    slide.classList.add('active');
                    dots[index].classList.add('active');
                    
                    // Si elle contient une vidéo, on lance la lecture !
                    if (video) {
                        video.play().catch(e => {
                            console.log("Lecture automatique bloquée par le navigateur.", e);
                        });
                    }
                }
            });
        }

        function goToSlide(n) {
            currentSlide = n;
            updateSlider();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlider();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlider();
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (sliderContainer.requestFullscreen) {
                    sliderContainer.requestFullscreen();
                } else if (sliderContainer.webkitRequestFullscreen) {
                    sliderContainer.webkitRequestFullscreen();
                } else if (sliderContainer.msRequestFullscreen) {
                    sliderContainer.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '✖'; 
                fullscreenBtn.title = "Quitter le plein écran";
            } else {
                fullscreenBtn.innerHTML = '⛶';
                fullscreenBtn.title = "Plein écran";
            }
        });
    </script>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, stars = [];

        const PALETTE = [
            [0.00, [0,   0,   0  ]],
            [0.20, [2,   3,   6  ]],
            [0.40, [3,   5,   12 ]],
            [0.60, [4,   7,   18 ]],
            [0.80, [5,   9,   22 ]],
            [1.00, [6,   11,  28 ]],
        ];

        function lerp(a, b, t) { return a + (b - a) * t; }
        function lerpColor(c1, c2, t) {
            return [Math.round(lerp(c1[0],c2[0],t)), Math.round(lerp(c1[1],c2[1],t)), Math.round(lerp(c1[2],c2[2],t))];
        }
        function getColor(frac) {
            frac = Math.max(0, Math.min(1, frac));
            for (let i = 0; i < PALETTE.length - 1; i++) {
                const [f0, c0] = PALETTE[i], [f1, c1] = PALETTE[i+1];
                if (frac >= f0 && frac <= f1) return lerpColor(c0, c1, (frac-f0)/(f1-f0));
            }
            return PALETTE[PALETTE.length-1][1];
        }

        function createStars() {
            stars = [];
            const count = Math.floor((W * H) / 3000);
            for (let i = 0; i < count; i++) {
                const sz = Math.random();
                stars.push({
                    x: Math.random() * W,
                    y: Math.pow(Math.random(), 1.5) * H,
                    r: sz < 0.6 ? 0.5 : sz < 0.88 ? 0.85 : 1.2,
                    baseAlpha: 0.3 + Math.random() * 0.6,
                    speed: 0.5 + Math.random() * 2.0,
                    phase: Math.random() * Math.PI * 2,
                });
            }
        }

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            createStars();
        }

        let scrollFrac = 0, targetFrac = 0;
        window.addEventListener('scroll', () => {
            const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            targetFrac = window.scrollY / max;
        }, { passive: true });

        let lastT = 0;
        function render(now) {
            const dt = Math.min((now - lastT) / 1000, 0.05);
            lastT = now;
            scrollFrac += (targetFrac - scrollFrac) * 0.055;

            const tc = getColor(scrollFrac);
            const bc = getColor(Math.min(1, scrollFrac + 0.3));
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, `rgb(${tc[0]},${tc[1]},${tc[2]})`);
            grad.addColorStop(1, `rgb(${bc[0]},${bc[1]},${bc[2]})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const t = now / 1000;
            for (const s of stars) {
                const starY = s.y / H;
                const vis = Math.max(0, 1 - (scrollFrac - starY * 0.5 + 0.15) * 3.5);
                if (vis <= 0.01) continue;
                const twinkle = 0.45 + 0.55 * Math.sin(t * s.speed + s.phase);
                const alpha = s.baseAlpha * twinkle * vis;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(215,225,255,${alpha})`;
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(render);
    </script>
